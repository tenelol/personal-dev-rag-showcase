name: demo

on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m rag_demo.index --source data/sample_notes
      - run: python -m rag_demo.search "React form typing" --top-k 3
      - run: python -m rag_demo.context "Build a typed React form" --top-k 3 --max-chars 2000
