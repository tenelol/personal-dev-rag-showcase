services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: personal-dev-rag-qdrant-example
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

volumes:
  qdrant_storage:
